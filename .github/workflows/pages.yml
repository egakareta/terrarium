on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.action != 'closed' &&
      (github.ref == 'refs/heads/master' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/configure-pages@v5
        id: pages
      - run: |
          mise run build:examples:web
          touch web/dist/.nojekyll
        env:
          PAGES_BASE_PATH: >-
            ${{ steps.pages.outputs.base_path }}${{ github.event_name == 'pull_request' &&
            format('/pr-preview/pr-{0}', github.event.number) || '' }}
      - run: |
          cd web
          npx playwright install --with-deps chromium
          npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: pages
          path: web/dist
          include-hidden-files: true
  deploy:
    if: >-
      ${{ !cancelled() &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (needs.build.result == 'success' || github.event.action == 'closed') &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: github.event.action != 'closed'
        with:
          name: pages
          path: web/dist
      - uses: JamesIves/github-pages-deploy-action@v4
        if: github.event_name != 'pull_request'
        with:
          folder: web/dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
      - uses: rossjrw/pr-preview-action@v1
        if: github.event_name == 'pull_request'
        with:
          source-dir: web/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: false
