on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/install-linux-deps.sh
      - uses: jdx/mise-action@v4
        with:
          bootstrap: false
      - uses: Swatinem/rust-cache@v2
      - run: mise run check
  test:
    runs-on: ubuntu-24.04
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/install-linux-deps.sh
      - name: Select lavapipe software Vulkan ICD
        run: |
          icd="$(ls /usr/share/vulkan/icd.d/*.json /etc/vulkan/icd.d/*.json 2>/dev/null | grep -iE '(lvp|lavapipe)' | head -1)"
          if [ -z "$icd" ]; then
            echo "::error::No lavapipe ICD found"
            ls -la /usr/share/vulkan/icd.d/ || true
            exit 1
          fi
          echo "Using lavapipe ICD: $icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - run: vulkaninfo --summary || true
      - uses: jdx/mise-action@v4
        with:
          bootstrap: false
      - uses: Swatinem/rust-cache@v2
      - run: xvfb-run -a mise run test
  native-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-12
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: cargo check -p trengine --all-targets --features devtools,meshpart,compat,metal,dx12
