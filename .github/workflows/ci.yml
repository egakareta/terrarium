on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          bootstrap: true
          bootstrap_args: "--update"
      - uses: Swatinem/rust-cache@v2
      - name: Check macro feature combinations
        run: |
          for features in '' scene devtools engine scene,devtools scene,engine devtools,engine scene,devtools,engine; do
            cargo check -p trmacros --lib --no-default-features --features "$features" --locked
          done
      - run: mise run check
  test-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: awalsh128/cache-apt-pkgs-action@v1
        if: runner.os == 'Linux'
        with:
          packages: libssl-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dri libvulkan-dev mesa-vulkan-drivers vulkan-tools xvfb
          version: 1.0
      - name: Select lavapipe software Vulkan ICD
        if: runner.os == 'Linux'
        run: |
          icd="$(ls /usr/share/vulkan/icd.d/*.json /etc/vulkan/icd.d/*.json 2>/dev/null | grep -iE '(lvp|lavapipe)' | head -1)"
          if [ -z "$icd" ]; then
            echo "::error::No lavapipe ICD found"
            ls -la /usr/share/vulkan/icd.d/ || true
            exit 1
          fi
          echo "Using lavapipe ICD: $icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - run: vulkaninfo --summary || true
        if: runner.os == 'Linux'
      - uses: jdx/mise-action@v4
        with:
          bootstrap: true
          bootstrap_args: "--update"
      - uses: Swatinem/rust-cache@v2
      - run: xvfb-run -a mise run test:native
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          WGPU_BACKEND: vulkan
      - run: mise run test:native
        if: runner.os == 'macOS'
      - run: mise run test:native --config 'profile.dev.package."*".opt-level=3'
        if: runner.os == 'Windows'
  test-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          bootstrap: true
          bootstrap_args: "--update"
      - uses: Swatinem/rust-cache@v2
      - run: mise run test:wasm
      - name: Check tick networking feature combinations on web
        run: |
          cargo check -p trnetwork --target wasm32-unknown-unknown --locked
          cargo check -p trnetwork --all-features --target wasm32-unknown-unknown --locked
          cargo check --example network --features network --target wasm32-unknown-unknown --locked
        env:
          CARGO_UNSTABLE_BUILD_STD: std,panic_abort
      - name: Build standalone tick server
        run: cargo build -p trnetwork --features server --example server --locked
      - name: Test integrated and remote ticks in browser
        run: |
          target/debug/examples/server &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          wasm-pack test --headless --chrome crates/trnetwork --all-features
        env:
          CARGO_UNSTABLE_BUILD_STD: std,panic_abort
          WASM_BINDGEN_TEST_WEBDRIVER_JSON: ${{ github.workspace }}/tests/webdriver.json
