[package]
name = "monorepo"
version.workspace = true
edition.workspace = true
description.workspace = true
documentation.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[workspace]
resolver = "3"
members = [".", "crates/terrarium", "crates/trclipboard"]
default-members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "A simple, extensible 3D engine."
documentation = "https://docs.rs/terrarium"
repository = "https://github.com/egakareta/terrarium"
license = "MIT"

[workspace.dependencies]
terrarium = { path = "crates/terrarium/" }
trclipboard = { path = "crates/trclipboard" }

[[example]]
name = "bevy"
required-features = ["bevy"]

[[example]]
name = "gltf"
required-features = ["meshpart"]

[[example]]
name = "viewport"
required-features = ["meshpart"]

[[example]]
name = "physics"
required-features = ["physics"]

[[example]]
name = "sound"
required-features = ["sound"]

[[test]]
name = "bevy"
required-features = ["bevy"]

[[test]]
name = "gpu"
required-features = ["meshpart"]

[dependencies]
terrarium = { workspace = true }
