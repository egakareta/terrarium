[package]
name = "monorepo"
version.workspace = true
edition.workspace = true
description.workspace = true
documentation.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[workspace]
resolver = "3"
members = [
  ".",
  "crates/terrarium/",
  "crates/terrarium-macros/",
  "crates/trclipboard/",
  "crates/trpersistence/",
  "crates/trrender/",
  "crates/trscene/",
  "crates/trrendert/",
]
default-members = [
  ".",
  "crates/terrarium/",
  "crates/trrender/",
  "crates/trscene/",
  "crates/trrendert/",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "A simple, extensible 3D engine."
documentation = "https://docs.rs/terrarium"
repository = "https://github.com/egakareta/terrarium"
license = "MIT"

[workspace.dependencies]
terrarium = { version = "0.1", path = "crates/terrarium/" }
terrarium-macros = { version = "0.1", path = "crates/terrarium-macros/" }
trclipboard = { version = "0.1", path = "crates/trclipboard/" }
trpersistence = { version = "0.1", path = "crates/trpersistence/" }
trrender = { version = "0.1", path = "crates/trrender/" }
trscene = { version = "0.1", path = "crates/trscene/" }
trrendert = { version = "0.1", path = "crates/trrendert/" }

[[example]]
name = "bevy"
required-features = ["bevy"]

[[example]]
name = "gltf"
required-features = ["meshpart"]

[[example]]
name = "viewport"
required-features = ["meshpart"]

[[example]]
name = "physics"
required-features = ["physics"]

[[example]]
name = "sound"
required-features = ["sound"]

[dependencies]
terrarium = { workspace = true }

[features]
# auto-managed by cargo-forward-flags
# <forward terrarium>
asio = ["terrarium/asio"]
bevy = ["terrarium/bevy"]
cli = ["terrarium/cli"]
clipboard = ["terrarium/clipboard"]
compat = ["terrarium/compat"]
default-fonts = ["terrarium/default-fonts"]
default-materials = ["terrarium/default-materials"]
default-skybox = ["terrarium/default-skybox"]
dx12 = ["terrarium/dx12"]
eframe-default-fonts = ["terrarium/eframe-default-fonts"]
flac = ["terrarium/flac"]
gles = ["terrarium/gles"]
jack = ["terrarium/jack"]
meshpart = ["terrarium/meshpart"]
metal = ["terrarium/metal"]
mp3 = ["terrarium/mp3"]
mp4 = ["terrarium/mp4"]
nightly = ["terrarium/nightly"]
persistence = ["terrarium/persistence"]
physics = ["terrarium/physics"]
sound = ["terrarium/sound"]
vorbis = ["terrarium/vorbis"]
vulkan = ["terrarium/vulkan"]
wav = ["terrarium/wav"]
webgl = ["terrarium/webgl"]
webgpu = ["terrarium/webgpu"]
x11 = ["terrarium/x11"]
# </forward>
