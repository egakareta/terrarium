[package]
name = "terrarium"
version.workspace = true
edition.workspace = true
description.workspace = true
documentation.workspace = true
repository.workspace = true
license.workspace = true

[workspace]
resolver = "3"
members = [
  ".",
  "crates/egui-text-outline/",
  "crates/trclipboard/",
  "crates/trdevtools-derive/",
  "crates/trdevtools/",
  "crates/trdylib/",
  "crates/trengine/",
  "crates/tregui/",
  "crates/trfont/",
  "crates/trinternal/",
  "crates/trpersistence/",
  "crates/trrender/",
  "crates/trrendert/",
  "crates/trscene/",
  "crates/trtask/",
]
default-members = [
  ".",
  "crates/egui-text-outline/",
  "crates/trclipboard/",
  "crates/trdevtools-derive/",
  "crates/trdevtools/",
  "crates/trdylib/",
  "crates/trengine/",
  "crates/tregui/",
  "crates/trfont/",
  "crates/trinternal/",
  "crates/trpersistence/",
  "crates/trrender/",
  "crates/trrendert/",
  "crates/trscene/",
  "crates/trtask/",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "A simple, extensible 3D engine."
documentation = "https://docs.rs/terrarium"
repository = "https://github.com/egakareta/terrarium"
license = "MIT"

[workspace.dependencies]
egui-text-outline = { path = "crates/egui-text-outline/", version = "0.1" }
trclipboard = { path = "crates/trclipboard/", version = "0.1" }
trdevtools = { path = "crates/trdevtools/", version = "0.1", default-features = false }
trdevtools-derive = { path = "crates/trdevtools-derive/", version = "0.1" }
trdylib = { path = "crates/trdylib/", version = "0.1" }
trengine = { path = "crates/trengine/", version = "0.1", default-features = false }
tregui = { path = "crates/tregui/", version = "0.1", default-features = false }
trfont = { path = "crates/trfont/", version = "0.1", default-features = false }
trinternal = { path = "crates/trinternal/", version = "0.1" }
trpersistence = { path = "crates/trpersistence/", version = "0.1" }
trrender = { path = "crates/trrender/", version = "0.1" }
trrendert = { path = "crates/trrendert/", version = "0.1" }
trscene = { path = "crates/trscene/", version = "0.1" }
trtask = { path = "crates/trtask/", version = "0.1" }

[[example]]
name = "bevy"
required-features = ["bevy"]

[[example]]
name = "gltf"
required-features = ["meshpart"]

[[example]]
name = "viewport"
required-features = ["meshpart"]

[[example]]
name = "physics"
required-features = ["physics"]

[[example]]
name = "sound"
required-features = ["sound"]

[[test]]
name = "bevy"
required-features = ["bevy"]

[[test]]
name = "clipboard"
required-features = ["clipboard"]

[[test]]
name = "gpu"
required-features = ["meshpart"]

[[test]]
name = "devtools"
required-features = ["devtools"]

[dependencies]
trdevtools = { workspace = true, optional = true }
trinternal = { workspace = true, optional = true }

[dev-dependencies]
approx = "0.5"
bevy_ecs = "0.20"
pollster = "1"
web-time = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
trdylib = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["Window", "Location"] }

[features]
default = ["static_linking"]
static_linking = ["dep:trinternal"]
dynamic_linking = ["dep:trdylib", "dep:trinternal"]

# auto-managed by cargo-forward-flags
# <forward trinternal>
asio = ["trinternal?/asio"]
bevy = ["trinternal?/bevy"]
cli = ["trinternal?/cli"]
clipboard = ["trinternal?/clipboard"]
compat = ["trinternal?/compat"]
default-fonts = ["trinternal?/default-fonts"]
default-materials = ["trinternal?/default-materials"]
default-skybox = ["trinternal?/default-skybox"]
devtools = ["trinternal?/devtools"]
dx12 = ["trinternal?/dx12"]
flac = ["trinternal?/flac"]
gles = ["trinternal?/gles"]
jack = ["trinternal?/jack"]
meshpart = ["trinternal?/meshpart"]
metal = ["trinternal?/metal"]
mp3 = ["trinternal?/mp3"]
mp4 = ["trinternal?/mp4"]
nightly = ["trinternal?/nightly"]
persistence = ["trinternal?/persistence"]
phosphor = ["trinternal?/phosphor"]
physics = ["trinternal?/physics"]
sound = ["trinternal?/sound"]
vorbis = ["trinternal?/vorbis"]
vulkan = ["trinternal?/vulkan"]
wav = ["trinternal?/wav"]
webgl = ["trinternal?/webgl"]
webgpu = ["trinternal?/webgpu"]
x11 = ["trinternal?/x11"]
# </forward>
