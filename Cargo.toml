[package]
name = "terrarium"
version = "0.1.0"
edition = "2024"

[[example]]
name = "bevy"
required-features = ["bevy"]

[[example]]
name = "gltf"
required-features = ["meshpart"]

[[example]]
name = "viewport"
required-features = ["meshpart"]

[[example]]
name = "physics"
required-features = ["physics"]

[[example]]
name = "sound"
required-features = ["sound"]

[[test]]
name = "bevy"
required-features = ["bevy"]

[[test]]
name = "gpu"
required-features = ["meshpart"]

[dependencies]
base64 = { version = "0.23", optional = true }
bevy_app = { version = "0.20", features = ["web"], optional = true }
bevy_ecs = { version = "0.20", optional = true }
bevy_tasks = { version = "0.20", optional = true }
bevy_time = { version = "0.20", optional = true }
bytemuck = { version = "1", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = [
  "wgpu_no_default_features",
  "wayland",
] }
env_logger = "0.11"
euphorium = { version = "0.6", default-features = false, optional = true }
glam = { version = "0.33", default-features = false, features = ["std"] }
gltf = { version = "1", optional = true }
image = { version = "0.25", default-features = false, features = ["webp"] }
log = "0.4"
rapier3d = { version = "0.36", optional = true }
renfs = { version = "0.2", optional = true }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slotmap = "1"
thiserror = "2"
web-time = "1"
wgpu = { version = "30", default-features = false, features = ["std"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland"] }

[dev-dependencies]
approx = "0.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1"

[target.'cfg(all(any(unix, windows), not(any(target_os = "android", target_os = "ios", target_os = "emscripten"))))'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Clipboard",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "Navigator",
  "Window",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
default = [
  "asio",
  "default-fonts",
  "default-skybox",
  "dx12",
  "eframe-default-fonts",
  "flac",
  "gles",
  "meshpart",
  "metal",
  "mp3",
  "persistence",
  "physics",
  "sound",
  "vorbis",
  "wav",
  "webgpu",
]
bevy = ["dep:bevy_app", "dep:bevy_ecs", "dep:bevy_tasks", "dep:bevy_time"]
default-fonts = []
default-skybox = []
meshpart = ["dep:gltf"]
physics = ["dep:rapier3d"]
persistence = ["dep:base64", "dep:renfs"]
sound = ["dep:euphorium"]

# you usually want this since this also comes with emojis
eframe-default-fonts = ["eframe/default_fonts"]

# audio
asio = ["euphorium?/asio"]
cli = ["euphorium?/cli"]
flac = ["euphorium?/flac"]
jack = ["euphorium?/jack"]
mp3 = ["euphorium?/mp3"]
mp4 = ["euphorium?/mp4"]
nightly = ["euphorium?/nightly"]
vorbis = ["euphorium?/vorbis"]
wav = ["euphorium?/wav"]

# 3d graphics
dx12 = ["wgpu/dx12"]
gles = ["wgpu/gles"]
metal = ["wgpu/metal"]
webgpu = ["wgpu/webgpu"]

# for production, enabling these is a good idea
compat = ["vulkan", "webgl", "x11"]
vulkan = ["wgpu/vulkan"]
webgl = ["wgpu/webgl"]
x11 = ["eframe/x11", "winit/x11"]
