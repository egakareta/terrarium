[package]
name = "terrarium"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
egui = { version = "0.36", optional = true }
egui-wgpu = { version = "0.36", default-features = false, optional = true }
egui-winit = { version = "0.36", default-features = false, optional = true }
env_logger = "0.11"
glam = "0.33"
image = { version = "0.25" }
log = "0.4"
pollster = "1"
serde = "1"
serde_json = "1"
slotmap = "1"
thiserror = "2"
web-time = "1"
wgpu = "30"
winit = "0.30"

[features]
default = ["egui"]
egui = ["dep:egui", "dep:egui-wgpu", "dep:egui-winit"]
