[package]
name = "terrarium"
version = "0.1.0"
edition = "2024"

[features]
default = [
  "meshpart",
  "physics",
  "default-skybox",
  "default-fonts",
  "eframe-default-fonts",
  "sound",
]
bevy = ["dep:bevy_app", "dep:bevy_ecs", "dep:bevy_tasks", "dep:bevy_time"]
meshpart = ["dep:gltf"]
physics = ["dep:rapier3d"]
default-skybox = []
default-fonts = []
eframe-default-fonts = ["eframe/default_fonts"]
sound = ["dep:euphorium"]

[dependencies]
bevy_app = { version = "0.19", features = ["web"], optional = true }
bevy_ecs = { version = "0.19", optional = true }
bevy_tasks = { version = "0.19", optional = true }
bevy_time = { version = "0.19", optional = true }
bytemuck = { version = "1", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = ["wayland", "wgpu", "x11"] }
env_logger = "0.11"
euphorium = { version = "0.6", optional = true }
glam = "0.33"
gltf = { version = "1", optional = true }
image = { version = "0.25" }
log = "0.4"
rapier3d = { version = "0.35", optional = true }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slotmap = "1"
thiserror = "2"
web-time = "1"
wgpu = "30"
winit = "0.30"

[dev-dependencies]
approx = "0.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[[example]]
name = "bevy"
required-features = ["bevy"]

[[example]]
name = "gltf"
required-features = ["meshpart"]

[[example]]
name = "viewport"
required-features = ["meshpart"]

[[example]]
name = "physics"
required-features = ["physics"]

[[example]]
name = "sound"
required-features = ["sound"]

[[test]]
name = "bevy"
required-features = ["bevy"]

[[test]]
name = "gpu"
required-features = ["meshpart"]
