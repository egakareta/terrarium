[package]
name = "monorepo"
version.workspace = true
edition.workspace = true
description.workspace = true
documentation.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[workspace]
resolver = "3"
members = [
  ".",
  "crates/terrarium/",
  "crates/trclipboard/",
  "crates/trengine/",
  "crates/trfont/",
  "crates/trpersistence/",
  "crates/trrender/",
  "crates/trrendert/",
  "crates/trscene/",
]
default-members = [
  ".",
  "crates/terrarium/",
  "crates/trclipboard/",
  "crates/trengine/",
  "crates/trfont/",
  "crates/trpersistence/",
  "crates/trrender/",
  "crates/trrendert/",
  "crates/trscene/",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "A simple, extensible 3D engine."
documentation = "https://docs.rs/terrarium"
repository = "https://github.com/egakareta/terrarium"
license = "MIT"

[workspace.dependencies]
terrarium = { path = "crates/terrarium/", version = "0.1" }
trclipboard = { path = "crates/trclipboard/", version = "0.1" }
trengine = { path = "crates/trengine/", version = "0.1", default-features = false }
trfont = { path = "crates/trfont/", version = "0.1", default-features = false }
trpersistence = { path = "crates/trpersistence/", version = "0.1" }
trrender = { path = "crates/trrender/", version = "0.1" }
trrendert = { path = "crates/trrendert/", version = "0.1" }
trscene = { path = "crates/trscene/", version = "0.1" }

[[example]]
name = "bevy"
required-features = ["bevy"]

[[example]]
name = "gltf"
required-features = ["meshpart"]

[[example]]
name = "viewport"
required-features = ["meshpart"]

[[example]]
name = "physics"
required-features = ["physics"]

[[example]]
name = "sound"
required-features = ["sound"]

[[test]]
name = "bevy"
required-features = ["bevy"]

[[test]]
name = "clipboard"
required-features = ["clipboard"]

[[test]]
name = "gpu"
required-features = ["meshpart"]

[dependencies]
terrarium = { workspace = true }

[dev-dependencies]
approx = "0.5"
bevy_ecs = "0.20"
pollster = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
# auto-managed by cargo-forward-flags
# <forward terrarium>
asio = ["terrarium/asio"]
bevy = ["terrarium/bevy"]
cli = ["terrarium/cli"]
clipboard = ["terrarium/clipboard"]
compat = ["terrarium/compat"]
default-fonts = ["terrarium/default-fonts"]
default-materials = ["terrarium/default-materials"]
default-skybox = ["terrarium/default-skybox"]
dx12 = ["terrarium/dx12"]
eframe-default-fonts = ["terrarium/eframe-default-fonts"]
flac = ["terrarium/flac"]
gles = ["terrarium/gles"]
jack = ["terrarium/jack"]
meshpart = ["terrarium/meshpart"]
metal = ["terrarium/metal"]
mp3 = ["terrarium/mp3"]
mp4 = ["terrarium/mp4"]
nightly = ["terrarium/nightly"]
persistence = ["terrarium/persistence"]
physics = ["terrarium/physics"]
sound = ["terrarium/sound"]
vorbis = ["terrarium/vorbis"]
vulkan = ["terrarium/vulkan"]
wav = ["terrarium/wav"]
webgl = ["terrarium/webgl"]
webgpu = ["terrarium/webgpu"]
x11 = ["terrarium/x11"]
# </forward>
