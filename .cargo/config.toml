[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 0
debug = 0
hint-mostly-unused = true

[profile.dev.package.egui]
opt-level = 3

[profile.dev.package.epaint]
opt-level = 3

[profile.dev.package.parry3d]
opt-level = 3

[profile.dev.package.rapier3d]
opt-level = 3

[profile.dev.package.wgpu]
opt-level = 3
hint-mostly-unused = false

[profile.dev.package.wgpu-core]
opt-level = 3
hint-mostly-unused = false

[profile.dev.package.wgpu-hal]
opt-level = 3
hint-mostly-unused = false

[target.wasm32-unknown-unknown]
rustflags = [
  "-C",
  "target-feature=+atomics,+bulk-memory,+mutable-globals",
  "-C",
  "link-arg=--shared-memory",
  "-C",
  "link-arg=--no-check-features",
  "-C",
  "link-arg=--max-memory=1073741824",
  "-C",
  "link-arg=--import-memory",
  "-C",
  "link-arg=--export=__wasm_init_tls",
  "-C",
  "link-arg=--export=__tls_size",
  "-C",
  "link-arg=--export=__tls_align",
  "-C",
  "link-arg=--export=__tls_base",
]

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

[unstable]
profile-hint-mostly-unused = true
