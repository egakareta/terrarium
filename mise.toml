[tools]
clang = "18"
"github:egakareta/cargo-forward-flags" = "0.3.0"
"github:Unreal-Works/cmdshim" = "latest"
"github:rust-cross/cargo-xwin" = "latest"
"github:rust-lang/mdBook" = "latest"
"github:trunk-rs/trunk" = "latest"
"github:wasm-bindgen/wasm-pack" = "latest"
lefthook = "latest"
oxfmt = "latest"
rust = { version = "nightly-2026-03-12", components = ["clippy", "rustfmt", "rust-src"] }

[hooks]
postinstall = ["lefthook install"]

[tasks.check]
description = "Run all linting and formatting checks"
depends = ["lint"]
run = "mise format:cargo --check && mise format:oxfmt --check"

[tasks.format]
description = "Format .rs/.toml/.yml"
depends = ["format:cargo", "format:oxfmt"]

[tasks."format:cargo"]
description = "Format .rs"
run = "cargo fmt --all"

[tasks."format:oxfmt"]
description = "Format .toml/.yml"
run = "oxfmt"

[tasks.lint]
description = "Lint .rs"
run = "cargo clippy --all-targets --all-features --workspace -- -D warnings"

[tasks.test]
description = "Run .rs tests for native and wasm"
run = "mise run test:native && mise run test:wasm"

[tasks."test:native"]
description = "Run .rs tests for native"
run = "cargo test --workspace --all-targets --all-features"

[tasks."test:wasm"]
description = "Run .rs tests for wasm"
run = "wasm-pack test --headless --chrome"
env = { CARGO_UNSTABLE_BUILD_STD = "std,panic_abort", WASM_BINDGEN_TEST_WEBDRIVER_JSON = "tests/webdriver.json" }

[tasks."bench:native"]
description = "Run benchmarks for native"
run = "cargo bench --workspace --benches"

[tasks."build:examples:web"]
description = "Build the web examples gallery for GitHub Pages"
dir = "{{config_root}}"
env = { RUSTFLAGS = "" }
run = "cargo -Zscript scripts/build-examples-web.rs"

# this lets you run the cli with `terrarium ...`
[env]
_.path = { path = ["{{ exec(command='cmdshim path') }}"], tools = true }

[_.cmdshim.terrarium]
run = [
  "cargo",
  "run",
  "--quiet",
  "--manifest-path",
  "{{config_root}}/Cargo.toml",
  "--all-features",
  "--",
]

[bootstrap.packages]
"apt:libasound2-dev" = "latest"
"apt:libjack-jackd2-dev" = "latest"
"apt:libudev-dev" = "latest"
"apt:pkg-config" = "latest"
