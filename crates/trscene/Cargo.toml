[package]
name = "trscene"
version.workspace = true
edition.workspace = true
description = "Scene graph and workspace runtime for Terrarium."
documentation.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
egui = "0.36"
euphorium = { version = "0.6", default-features = false, optional = true }
gltf = { version = "1", optional = true }
log = "0.4"
rapier3d = { version = "0.36", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slotmap = "1"
terrarium-macros = { workspace = true }
thiserror = "2"
trrendert = { workspace = true }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland"] }

[dev-dependencies]
approx = "0.5"

[features]
meshpart = ["dep:gltf"]
physics = ["dep:rapier3d"]
sound = ["dep:euphorium"]

# <forward trrendert>
default-materials = ["trrendert/default-materials"]
default-skybox = ["trrendert/default-skybox"]
# </forward>

# <forward euphorium exclude="parking_lot_core">
asio = ["euphorium?/asio"]
cli = ["euphorium?/cli"]
flac = ["euphorium?/flac"]
jack = ["euphorium?/jack"]
mp3 = ["euphorium?/mp3"]
mp4 = ["euphorium?/mp4"]
nightly = ["euphorium?/nightly"]
vorbis = ["euphorium?/vorbis"]
wav = ["euphorium?/wav"]
# </forward>
