[package]
name = "trengine"
version.workspace = true
edition.workspace = true
description = "Tauri and wgpu application runtime for Terrarium."
documentation = "https://docs.rs/trengine"
repository.workspace = true
license.workspace = true
include = [
  "src/**",
  "build.rs",
  "tauri.conf.json",
  "frontend/**",
  "icons/**",
  "README.md",
  "Cargo.toml",
]

[dependencies]
egui = { version = "0.36", features = ["serde"] }
egui-wgpu = { version = "0.36", default-features = false, features = [
  "fragile-send-sync-non-atomic-wasm",
] }
egui-phosphor = { version = "0.14", default-features = false, features = [
  "regular",
], optional = true }
bevy_app = { version = "0.20", features = ["web"], optional = true }
bevy_ecs = { version = "0.20", optional = true }
bevy_tasks = { version = "0.20", optional = true }
bevy_time = { version = "0.20", optional = true }
env_logger = "0.11"
log = "0.4"
slotmap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trdevtools = { workspace = true, optional = true }
trfont = { workspace = true }
trrender = { workspace = true }
trscene = { workspace = true }
wgpu = { version = "30", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1"
trclipboard = { workspace = true }
webbrowser = "1"
tauri = { version = "2", default-features = false, features = [
  "wry",
  "compression",
  "custom-protocol",
  "x11",
] }

[target.'cfg(not(target_arch = "wasm32"))'.build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSEvent"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSThread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
futures-channel = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "HtmlCanvasElement",
  "Navigator",
  "Window",
] }

[features]
bevy = ["dep:bevy_app", "dep:bevy_ecs", "dep:bevy_tasks", "dep:bevy_time"]
default-fonts = ["trfont/default-fonts"]
default-materials = ["trrender/default-materials", "trscene/default-materials"]
default-skybox = ["trrender/default-skybox", "trscene/default-skybox"]
devtools = ["dep:trdevtools", "dep:egui-phosphor", "trscene/devtools"]
phosphor = ["dep:egui-phosphor"]
x11 = []

# <forward trscene exclude="default-materials,default-skybox,devtools">
asio = ["trscene/asio"]
cli = ["trscene/cli"]
flac = ["trscene/flac"]
jack = ["trscene/jack"]
meshpart = ["trscene/meshpart"]
mp3 = ["trscene/mp3"]
mp4 = ["trscene/mp4"]
nightly = ["trscene/nightly"]
physics = ["trscene/physics"]
sound = ["trscene/sound"]
vorbis = ["trscene/vorbis"]
wav = ["trscene/wav"]
# </forward>

# 3d graphics
dx12 = ["wgpu/dx12"]
gles = ["wgpu/gles"]
metal = ["wgpu/metal"]
vulkan = ["wgpu/vulkan"]
webgl = ["wgpu/webgl"]
webgpu = ["wgpu/webgpu"]

# for production, enabling these is a good idea
compat = ["vulkan", "webgl", "x11"]
