[package]
name = "trdevtools-derive"
version.workspace = true
edition.workspace = true
description = "Field reflection derives for Terrarium DevTools."
documentation.workspace = true
repository.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }

[dev-dependencies]
tr = { package = "trdevtools", path = "../trdevtools" }
