[package]
name = "trinternal"
version.workspace = true
edition.workspace = true
description = "Internal implementation crate for Terrarium."
documentation = "https://docs.rs/trinternal"
repository.workspace = true
license.workspace = true

[dependencies]
trclipboard = { workspace = true, optional = true }
trengine = { workspace = true }
trpersistence = { workspace = true, optional = true }
trrender = { workspace = true }
trscene = { workspace = true }

[features]
default = [
  "asio",
  "clipboard",
  "default-fonts",
  "default-materials",
  "default-skybox",
  "dx12",
  "eframe-default-fonts", # you usually want this since this also comes with emojis
  "flac",
  "gles",
  "meshpart",
  "metal",
  "mp3",
  "persistence",
  "physics",
  "sound",
  "vorbis",
  "wav",
  "webgpu",
]

clipboard = ["dep:trclipboard"]
persistence = ["dep:trpersistence"]

# <forward trengine>
asio = ["trengine/asio"]
bevy = ["trengine/bevy"]
cli = ["trengine/cli"]
compat = ["trengine/compat"]
default-fonts = ["trengine/default-fonts"]
default-materials = ["trengine/default-materials"]
default-skybox = ["trengine/default-skybox"]
dx12 = ["trengine/dx12"]
eframe-default-fonts = ["trengine/eframe-default-fonts"]
flac = ["trengine/flac"]
gles = ["trengine/gles"]
jack = ["trengine/jack"]
meshpart = ["trengine/meshpart"]
metal = ["trengine/metal"]
mp3 = ["trengine/mp3"]
mp4 = ["trengine/mp4"]
nightly = ["trengine/nightly"]
physics = ["trengine/physics"]
sound = ["trengine/sound"]
vorbis = ["trengine/vorbis"]
vulkan = ["trengine/vulkan"]
wav = ["trengine/wav"]
webgl = ["trengine/webgl"]
webgpu = ["trengine/webgpu"]
x11 = ["trengine/x11"]
# </forward>
