[package]
name = "trclipboard"
version.workspace = true
edition.workspace = true
description = "Cross-platform (including web) clipboard access for Rust"
documentation = "https://docs.rs/trclipboard"
repository.workspace = true
license.workspace = true
keywords = ["clipboard", "terrarium"]

[dependencies]
thiserror = "2"

[target.'cfg(all(any(unix, windows), not(any(target_os = "android", target_os = "ios", target_os = "emscripten"))))'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Clipboard", "Navigator", "Window"] }
