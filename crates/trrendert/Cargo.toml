[package]
name = "trrendert"
version.workspace = true
edition.workspace = true
description = "Shared render types and assets for Terrarium."
documentation.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
basisu = { version = "0.1", default-features = false, features = ["std"], optional = true }
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.34", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["webp"] }
serde_json = { version = "1", optional = true }
terrarium-devtools-derive = { workspace = true, optional = true }
thiserror = "2"

[features]
default-materials = ["dep:basisu"]
default-skybox = []
devtools = ["dep:serde_json", "dep:terrarium-devtools-derive"]
