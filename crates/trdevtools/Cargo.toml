[package]
name = "trdevtools"
version.workspace = true
edition.workspace = true
description = "Workspace inspection tools for Terrarium."
documentation.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
egui = "0.36"
egui-text-outline = { workspace = true }
egui_dock = "0.21"
egui-phosphor = { version = "0.14", default-features = false, features = ["subset"] }
egui_ltreeview = "0.9"
trscene = { workspace = true, features = ["devtools"] }

[dev-dependencies]
serde_json = "1"
trscene = { workspace = true, features = ["devtools"] }
