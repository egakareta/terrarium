[package]
name = "trmacros"
version.workspace = true
edition.workspace = true
description = "Procedural macros for Terrarium."
documentation.workspace = true
repository.workspace = true
license.workspace = true

[lib]
proc-macro = true

[features]
default = []
scene = [
  "dep:heck",
  "dep:proc-macro-crate",
  "dep:proc-macro2",
  "dep:quote",
  "dep:syn",
  "syn/visit-mut",
]
devtools = ["dep:proc-macro-crate", "dep:proc-macro2", "dep:quote", "dep:syn"]
engine = ["dep:proc-macro2", "dep:quote", "dep:syn", "syn/visit-mut"]

[dependencies]
heck = { version = "0.5", optional = true }
proc-macro-crate = { version = "3", optional = true }
proc-macro2 = { version = "1", optional = true }
quote = { version = "1", optional = true }
syn = { version = "3", features = ["full"], optional = true }

[dev-dependencies]
trscene = { workspace = true }
tr = { package = "trdevtools", path = "../trdevtools" }
trengine = { workspace = true }

[[test]]
name = "scene_renamed"
required-features = ["scene"]

[[test]]
name = "devtools_renamed"
required-features = ["devtools"]
